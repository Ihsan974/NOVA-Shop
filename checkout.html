<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | NOVA</title>
  <style>
    body {
      background-color: #f8f9fa;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .checkout-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 40px;
    }
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; margin: 20px auto; }
    }
    .checkout-section {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #444;
    }
    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .order-summary-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      height: fit-content;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 18px;
      font-weight: 600;
    }
    .btn-whatsapp-order {
      display: block;
      width: 100%;
      background: #25D366;
      color: #ffffff;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 25px;
      box-sizing: border-box;
      cursor: pointer;
    }
    .btn-whatsapp-order:hover {
      background: #20ba5a;
    }
  </style>
</head>
<body>

  <div class="checkout-container">
    <div class="checkout-section">
      <h2>Shipping Details</h2>
      <form id="checkoutForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="John Doe" value="test">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="john@example.com" value="ihsansanu974@gmail.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="9876543210" value="8921033257">
          </div>
        </div>

        <div class="form-group">
          <label>Delivery Address</label>
          <input type="text" id="address" placeholder="House Name, Street Address" value="test">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" placeholder="Kochi" value="test">
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <input type="text" id="pincode" placeholder="682001" value="0000">
          </div>
        </div>
      </form>
    </div>

    <div class="order-summary-box">
      <h2>Order Summary</h2>
      <div id="checkoutItemsList">
        <!-- കാർട്ടിലെ വിവരങ്ങൾ ഇവിടെ വരും -->
      </div>
      
      <div class="summary-total">
        <span>Total Amount</span>
        <span id="checkoutTotal">₹0</span>
      </div>

      <!-- യഥാർത്ഥ പരിഹാരം: ഇൻലൈൻ onclick വഴി നേരിട്ട് ഫങ്ക്ഷൻ റൺ ചെയ്യിക്കുന്നു (ബ്രൗസറിന് ഇത് തടയാൻ കഴിയില്ല) -->
      <a href="#" onclick="sendOrderViaWhatsApp(event)" class="btn-whatsapp-order">🚀 Confirm & Send via WhatsApp</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
  // =========================================================================
  // 1. ഹോം പേജിലെ കാർട്ട് ഫങ്ക്ഷനുകൾ (HOME PAGE CART SYSTEM)
  // =========================================================================
  const cartCount = document.getElementById('cartCount') || document.querySelector('.cart-count');
  const cartItemsContainer = document.getElementById('cartItems');
  const cartTotal = document.getElementById('cartTotal');
  
  const cartButton = document.getElementById('cartButton');
  const cartSidebar = document.querySelector('aside') || document.querySelector('.cart-sidebar') || document.querySelector('.cart-overlay');
  const closeCartBtn = document.getElementById('closeCart') || document.querySelector('.close-cart');

  const allButtons = document.querySelectorAll('.add-cart, .add-to-cart, .add-to-cart-btn, #addToCartBtn');
  
  let count = 0;
  let totalAmount = 0;

  if (allButtons.length > 0) {
    allButtons.forEach(button => {
      button.addEventListener('click', (e) => {
        e.preventDefault();
        
        count++;
        if (cartCount) cartCount.textContent = count;
        
        const productName = button.getAttribute('data-product') || 'Wireless Earbuds';
        const productPriceText = button.getAttribute('data-price') || '0';
        const productPrice = parseInt(productPriceText.replace(/[^0-9]/g, '')) || 0;
        
        totalAmount += productPrice;
        if (cartTotal) {
          cartTotal.textContent = '₹' + totalAmount.toLocaleString('en-IN');
        }
        
        if (cartItemsContainer) {
          const emptyMsg = cartItemsContainer.querySelector('.empty-cart');
          if (emptyMsg) emptyMsg.remove();
          
          const newItem = document.createElement('div');
          newItem.className = 'cart-item';
          newItem.style.display = 'flex';
          newItem.style.justifyContent = 'space-between';
          newItem.style.margin = '15px 0';
          newItem.style.paddingBottom = '10px';
          newItem.style.borderBottom = '1px solid #eee';
          newItem.style.color = '#111111';
          newItem.innerHTML = `<span>${productName}</span> <strong>${productPriceText}</strong>`;
          cartItemsContainer.appendChild(newItem);
        }
        
        // ലോക്കൽ സ്റ്റോറേജിലേക്ക് ഡാറ്റ മാറ്റുന്നു (ചെക്കൗട്ട് പേജിന് വേണ്ടി)
        if (cartItemsContainer && cartTotal) {
          localStorage.setItem('cartItemsHTML', cartItemsContainer.innerHTML);
          localStorage.setItem('cartTotalAmount', cartTotal.textContent);
        }
        
        if (cartSidebar) {
          cartSidebar.classList.add('active');
        }
      });
    });
  }

  if (cartButton && cartSidebar) {
    cartButton.addEventListener('click', (e) => {
      e.preventDefault();
      cartSidebar.classList.toggle('active');
    });
  }

  if (closeCartBtn && cartSidebar) {
    closeCartBtn.addEventListener('click', (e) => {
      e.preventDefault();
      cartSidebar.classList.remove('active');
    });
  }

  // =========================================================================
  // 2. ചെക്കൗട്ട് പേജ് ലോഡ് ചെയ്യുമ്പോൾ കാർട്ട് വിവരങ്ങൾ കാണിക്കാൻ (CHECKOUT LOAD)
  // =========================================================================
  const itemsContainer = document.getElementById('checkoutItemsList');
  const totalContainer = document.getElementById('checkoutTotal');
  
  if (itemsContainer) {
    const savedItems = localStorage.getItem('cartItemsHTML');
    if (savedItems) itemsContainer.innerHTML = savedItems;
  }
  if (totalContainer) {
    const savedTotal = localStorage.getItem('cartTotalAmount');
    if (savedTotal) totalContainer.textContent = savedTotal;
  }
});

// =========================================================================
// 3. വാട്സാപ്പ് ഓർഡർ സിസ്റ്റം (WHATSAPP ORDER AUTOMATION - BULLETPROOF)
// =========================================================================
function sendOrderViaWhatsApp(e) {
  if (e) e.preventDefault(); // പേജ് മുകളിലേക്ക് ചാടുന്നത് തടയാൻ

  // ഫോമിൽ നിന്ന് വിവരങ്ങൾ കൃത്യമായി എടുക്കുന്നു
  const name = document.getElementById('name') ? document.getElementById('name').value : "Not Provided";
  const phone = document.getElementById('phone') ? document.getElementById('phone').value : "Not Provided";
  const address = document.getElementById('address') ? document.getElementById('address').value : "Not Provided";
  const city = document.getElementById('city') ? document.getElementById('city').value : "Not Provided";
  const pincode = document.getElementById('pincode') ? document.getElementById('pincode').value : "Not Provided";
  const savedTotal = localStorage.getItem('cartTotalAmount') || "₹0";

  const myWhatsAppNumber = "918921033257"; 

  let msgText = "NEW ORDER RECEIVED!\n\n";
  msgText += "Customer Details:\n";
  msgText += "Name: " + name + "\n";
  msgText += "Phone: " + phone + "\n\n";
  
  msgText += "Shipping Address:\n";
  msgText += "Address: " + address + "\n";
  msgText += "City: " + city + " - " + pincode + "\n\n";
  
  msgText += "Total Amount: " + savedTotal + "\n\n";
  msgText += "Thank you for shopping with NOVA!";

  // ബ്രൗസറിന് ഒരു ആശയക്കുഴപ്പവും വരാത്ത രീതിയിലുള്ള ഔദ്യോഗിക ലിങ്ക് ഫോർമാറ്റ്
  const whatsappURL = "https://whatsapp.com" + myWhatsAppNumber + "&text=" + encodeURIComponent(msgText);
  
  localStorage.clear(); // ഓർഡർ കംപ്ലീറ്റ് ആയതുകൊണ്ട് കാർട്ട് ക്ലീൻ ചെയ്യുന്നു
  
  // ബ്രൗസർ ബ്ലോക്ക് ചെയ്യാതെ ഇതേ വിൻഡോയിൽ നേരിട്ട് വാട്സാപ്പ് ചാറ്റിലേക്ക് വഴിമാറുന്നു
  window.location.href = whatsappURL;
}
</script>
</body>
</html>
