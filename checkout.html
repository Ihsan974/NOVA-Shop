<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #1c1c1c;
        }

        .checkout-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .container-box,
        .summary-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
        }

        .container-box {
            flex: 1;
        }

        .summary-box {
            width: 320px;
        }

        h2 {
            margin: 0 0 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eeeeee;
            font-size: 21px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d5d5;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #1c1c1c;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .total-label {
            font-size: 16px;
            font-weight: 600;
        }

        .total-price {
            font-size: 22px;
            font-weight: 700;
        }

        /* 100% സുരക്ഷിതമായ ലിങ്ക് ബട്ടൺ സ്റ്റൈൽ */
        .btn-confirm-link {
            display: block;
            width: 100%;
            padding: 15px;
            background: #111111;
            color: #ffffff;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-confirm-link:hover {
            background: #2c2c2c;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .checkout-wrapper {
                flex-direction: column;
            }
            .summary-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="checkout-wrapper">
    <!-- Shipping Details Form -->
    <div class="container-box">
        <h2>Shipping Details</h2>
        <form id="checkoutForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Your Name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@email.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Phone Number" required>
                </div>
            </div>

            <div class="form-group">
                <label for="address">Delivery Address</label>
                <input type="text" id="address" placeholder="Address" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="City" required>
                </div>
                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" placeholder="Pincode" required>
                </div>
            </div>
        </form>
    </div>

    <!-- Order Summary Box -->
    <div class="summary-box">
        <h2>Order Summary</h2>
        <div class="total-section">
            <span class="total-label">Total Amount</span>
            <span class="total-price">₹8,999</span>
        </div>
        
        <!-- ✅ ജാവാസ്ക്രിപ്റ്റ് പൂർണ്ണമായി ഒഴിവാക്കി 100% ഒറിജിനൽ സുരക്ഷിതമായ അപി ലിങ്ക് നേരിട്ട് നൽകിയിരിക്കുന്നു -->
        <a id="whatsappLink" href="https://whatsapp.com" class="btn-confirm-link">
            Confirm Order
        </a>
    </div>
</div>

<script>
    // ഫോമിൽ ടൈപ്പ് ചെയ്യുന്ന വിവരങ്ങൾ അനുസരിച്ച് ലിങ്ക് ബാക്ക്ഗ്രൗണ്ടിൽ ഓട്ടോമാറ്റിക് ആയി അപ്ഡേറ്റ് ചെയ്യും
    const form = document.getElementById('checkoutForm');
    const whatsappLink = document.getElementById('whatsappLink');

    function updateWhatsAppLink() {
        const fullName = document.getElementById('fullName').value || '';
        const email = document.getElementById('email').value || '';
        const phone = document.getElementById('phone').value || '';
        const address = document.getElementById('address').value || '';
        const city = document.getElementById('city').value || '';
        const pincode = document.getElementById('pincode').value || '';
        
        const myWhatsappNumber = "918921033257"; 

        const message = `*New Order Details* 🛍️\n\n` +
                        `*Name:* ${fullName}\n` +
                        `*Email:* ${email}\n` +
                        `*Phone:* ${phone}\n` +
                        `*Address:* ${address}, ${city} - ${pincode}\n\n` +
                        `*Total Amount:* INR 8999`;

        const encodedMessage = encodeURIComponent(message);
        
        // ശരിയായ ലിങ്ക് പാത ഇവിടെ ഭദ്രമായി നൽകിയിരിക്കുന്നു
        whatsappLink.href = `https://whatsapp.com{myWhatsappNumber}&text=${encodedMessage}`;
    }

    form.addEventListener('input', updateWhatsAppLink);
</script>

</body>
</html>
