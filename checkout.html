<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #1c1c1c;
        }

        .checkout-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .container-box,
        .summary-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
        }

        .container-box {
            flex: 1;
        }

        .summary-box {
            width: 320px;
        }

        h2 {
            margin: 0 0 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eeeeee;
            font-size: 21px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d5d5;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #1c1c1c;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .total-label {
            font-size: 16px;
            font-weight: 600;
        }

        .total-price {
            font-size: 22px;
            font-weight: 700;
        }

        .btn-confirm {
            width: 100%;
            padding: 15px;
            background: #111111;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-confirm:hover {
            background: #2c2c2c;
        }

        .btn-confirm:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .error-message {
            margin-top: 15px;
            color: #d93838;
            font-size: 13px;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .checkout-wrapper {
                flex-direction: column;
            }
            .summary-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="checkout-wrapper">
    <!-- Shipping Details Form -->
    <div class="container-box">
        <h2>Shipping Details</h2>
        <form id="checkoutForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="John Doe">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="9999999999">
                </div>
            </div>

            <div class="form-group">
                <label for="address">Delivery Address</label>
                <input type="text" id="address" required placeholder="Street, Apartment, Suite">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" required placeholder="Mumbai">
                </div>
                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" required placeholder="400001">
                </div>
            </div>
        </form>
    </div>

    <!-- Order Summary Box -->
    <div class="summary-box">
        <h2>Order Summary</h2>
        <div class="total-section">
            <span class="total-label">Total Amount</span>
            <span class="total-price">₹8,999</span>
        </div>
        <button type="submit" form="checkoutForm" id="confirmBtn" class="btn-confirm">Confirm Order</button>
        <div id="errorMessage" class="error-message">Unable to connect to the order server. Please try again.</div>
    </div>
</div>

<script>
    document.getElementById('checkoutForm').addEventListener('submit', function(e) {
        e.preventDefault(); // പേജ് റീഫ്രഷ് ആകുന്നത് തടയാൻ
        
        // ഫോമിൽ നിന്നുള്ള വിവരങ്ങൾ ശേഖരിക്കുന്നു
        const fullName = document.getElementById('fullName').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const city = document.getElementById('city').value;
        const pincode = document.getElementById('pincode').value;
        const totalAmount = "₹8,999"; // നിങ്ങളുടെ ഓർഡർ തുക

        // നിങ്ങളുടെ ബിസിനസ്സ് വാട്സ്ആപ്പ് നമ്പർ ഇവിടെ നൽകുക (Country code സഹിതം നൽകണം. ഉദാഹരണത്തിന്: 919876543210)
        const whatsappNumber = "918921033257"; 

        // വാട്സ്ആപ്പിലേക്ക് അയക്കേണ്ട മെസ്സേജ് ഫോർമാറ്റ് ചെയ്യുന്നു
        const message = `*New Order Details*🛍️\n\n` +
                        `*Name:* ${fullName}\n` +
                        `*Email:* ${email}\n` +
                        `*Phone:* ${phone}\n` +
                        `*Address:* ${address}, ${city} - ${pincode}\n\n` +
                        `*Total Amount:* ${totalAmount}`;

        // മെസ്സേജ് യുആർഎൽ (URL) രൂപത്തിലാക്കുന്നു
        const encodedMessage = encodeURIComponent(message);

        // വാട്സ്ആപ്പ് ലിങ്ക് ഉണ്ടാക്കുന്നു (ഇത് ഓട്ടോമാറ്റിക്കായി വാട്സ്ആപ്പ് വെബിലേക്കോ ആപ്പിലേക്കോ കൊണ്ടുപോകും)
        const whatsappUrl = `https://whatsapp.com{whatsappNumber}&text=${encodedMessage}`;

        // പുതിയ വിൻഡോയിൽ വാട്സ്ആപ്പ് ഓപ്പൺ ചെയ്യാൻ
        window.open(whatsappUrl, '_blank');
    });
</script>

</body>
</html>
