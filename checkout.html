<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | NOVA</title>
  <style>
    body {
      background-color: #f8f9fa;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .checkout-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 40px;
    }
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; margin: 20px auto; }
    }
    .checkout-section {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #444;
    }
    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .order-summary-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      height: fit-content;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 18px;
      font-weight: 600;
    }
    /* ബ്രൗസറിന് ഒരു കാരണവശാലും ബ്ലോക്ക് ചെയ്യാൻ പറ്റാത്ത സുരക്ഷിതമായ കറുത്ത ലിങ്ക് ബട്ടൺ സ്റ്റൈൽ */
    .btn-checkout-link {
      display: block;
      width: 100%;
      background: #111111;
      color: #ffffff;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 25px;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .btn-checkout-link:hover {
      background: #333333;
    }
  </style>
</head>
<body>

  <div class="checkout-container">
    <div class="checkout-section">
      <h2>Shipping Details</h2>
      <!-- ഫോമിൽ ടൈപ്പ് ചെയ്യുമ്പോൾ തന്നെ ലിങ്ക് അപ്ഡേറ്റ് ആകാൻ oninput നൽകി -->
      <form id="checkoutForm" oninput="updateOrderWhatsAppURL()">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="John Doe" value="test">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="john@example.com" value="ihsansanu974@gmail.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="9876543210" value="8921033257">
          </div>
        </div>

        <div class="form-group">
          <label>Delivery Address</label>
          <input type="text" id="address" placeholder="House Name, Street Address" value="test">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" placeholder="Kochi" value="test">
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <input type="text" id="pincode" placeholder="682001" value="0000">
          </div>
        </div>
      </form>
    </div>

    <div class="order-summary-box">
      <h2>Order Summary</h2>
      <div id="checkoutItemsList">
        <!-- കാർട്ടിലെ വിവരങ്ങൾ ഇവിടെ വരും -->
      </div>
      
      <div class="summary-total">
        <span>Total Amount</span>
        <span id="checkoutTotal">₹0</span>
      </div>

      <!-- യഥാർത്ഥ പരിഹാരം: ബ്രൗസറിന് ഒരു രീതിയിലും തടയാൻ കഴിയാത്ത നേരിട്ടുള്ള നോർമൽ ലിങ്ക് ടാഗ് -->
      <a href="#" id="realConfirmBtn" target="_self" class="btn-checkout-link">Confirm Order</a>
    </div>
  </div>

  <script>
  function updateOrderWhatsAppURL() {
    const name = document.getElementById('name').value || "Not Provided";
    const phone = document.getElementById('phone').value || "Not Provided";
    const address = document.getElementById('address').value || "Not Provided";
    const city = document.getElementById('city').value || "Not Provided";
    const pincode = document.getElementById('pincode').value || "Not Provided";
    const savedTotal = localStorage.getItem('cartTotalAmount') || "₹0";

    const myWhatsAppNumber = "918921033257"; 

    let msgText = "📦 NEW ORDER RECEIVED!\n\n";
    msgText += "👤 Customer Details:\n";
    msgText += "• Name: " + name + "\n";
    msgText += "• Phone: " + phone + "\n\n";
    msgText += "📍 Shipping Address:\n";
    msgText += "• Address: " + address + "\n";
    msgText += "• City: " + city + " - " + pincode + "\n\n";
    msgText += "💰 Total Amount: " + savedTotal + "\n\n";
    msgText += "Thank you for shopping with NOVA!";

    // ⚠️ നിങ്ങൾ ആവശ്യപ്പെട്ട കൃത്യമായ ഔദ്യോഗിക ://whatsapp.com ലിങ്ക് ഫോർമാറ്റ് (മുൻപിൽ https:// സഹിതം)
    const whatsappURL = "https://://whatsapp.com/send?phone=" + myWhatsAppNumber + "&text=" + encodeURIComponent(msgText);
    
    const confirmLink = document.getElementById('realConfirmBtn');
    if (confirmLink) {
      confirmLink.href = whatsappURL;
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    const savedItems = localStorage.getItem('cartItemsHTML');
    const savedTotal = localStorage.getItem('cartTotalAmount');

    if (savedItems) document.getElementById('checkoutItemsList').innerHTML = savedItems;
    if (savedTotal) document.getElementById('checkoutTotal').textContent = savedTotal;

    // പേജ് ലോഡ് ചെയ്യുമ്പോൾ തന്നെ കൃത്യമായ api ലിങ്ക് സെറ്റ് ചെയ്യുന്നു
    updateOrderWhatsAppURL();

    document.getElementById('realConfirmBtn').addEventListener('click', () => {
      localStorage.clear(); // കാർട്ട് ക്ലീൻ ചെയ്യുന്നു
    });
  });
</script>


</body>
</html>
