<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | NOVA</title>
  <style>
    body {
      background-color: #f8f9fa;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .checkout-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 40px;
    }
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; margin: 20px auto; }
    }
    .checkout-section {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #444;
    }
    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .order-summary-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      height: fit-content;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 18px;
      font-weight: 600;
    }
    /* ബ്രൗസറിന് ഒരു കാരണവശാലും ബ്ലോക്ക് ചെയ്യാൻ പറ്റാത്ത സാധാരണ ലിങ്ക് സ്റ്റൈൽ */
    .btn-whatsapp-link {
      display: block;
      width: 100%;
      background: #25D366;
      color: #ffffff;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 25px;
      box-sizing: border-box;
    }
    .btn-whatsapp-link:hover {
      background: #20ba5a;
    }
  </style>
</head>
<body>

  <div class="checkout-container">
    <div class="checkout-section">
      <h2>Shipping Details</h2>
      <form id="checkoutForm" oninput="generateOrderLink()">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="John Doe" value="test">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="john@example.com" value="ihsansanu974@gmail.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="9876543210" value="8921033257">
          </div>
        </div>

        <div class="form-group">
          <label>Delivery Address</label>
          <input type="text" id="address" placeholder="House Name, Street Address" value="test">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" placeholder="Kochi" value="test">
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <input type="text" id="pincode" placeholder="682001" value="0000">
          </div>
        </div>
      </form>
    </div>

    <div class="order-summary-box">
      <h2>Order Summary</h2>
      <div id="checkoutItemsList">
        <!-- കാർട്ടിലെ വിവരങ്ങൾ ഇവിടെ വരും -->
      </div>
      
      <div class="summary-total">
        <span>Total Amount</span>
        <span id="checkoutTotal">₹0</span>
      </div>

      <!-- പ്രധാന മാറ്റം: ഇവിടെ നമ്മൾ ജാവാസ്ക്രിപ്റ്റ് വഴി വിൻഡോ മാറ്റുന്നില്ല, നേരിട്ടുള്ള ലിങ്ക് ആണ് -->
      <a href="#" id="realWhatsAppBtn" target="_self" class="btn-whatsapp-link">
        Confirm & Send via WhatsApp
      </a>
    </div>
  </div>

  <script>
    function generateOrderLink() {
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const address = document.getElementById('address').value;
      const city = document.getElementById('city').value;
      const pincode = document.getElementById('pincode').value;
      const savedTotal = localStorage.getItem('cartTotalAmount') || "₹0";

      const myWhatsAppNumber = "918921033257"; 

      let msgText = "NEW ORDER RECEIVED!\n\n";
      msgText += "Customer Details:\n";
      msgText += "Name: " + name + "\n";
      msgText += "Phone: " + phone + "\n\n";
      msgText += "Shipping Address:\n";
      msgText += "Address: " + address + "\n";
      msgText += "City: " + city + " - " + pincode + "\n\n";
      msgText += "Total Amount: " + savedTotal + "\n\n";
      msgText += "Thank you for shopping with NOVA!";

      // ഔദ്യോഗിക സുരക്ഷിതമായ പൂർണ്ണമായ ലിങ്ക് ഫോർമാറ്റ്
      const whatsappURL = "https://whatsapp.com" + myWhatsAppNumber + "&text=" + encodeURIComponent(msgText);
      
      const linkBtn = document.getElementById('realWhatsAppBtn');
      if (linkBtn) {
        linkBtn.href = whatsappURL;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedItems = localStorage.getItem('cartItemsHTML');
      const savedTotal = localStorage.getItem('cartTotalAmount');

      if (savedItems) document.getElementById('checkoutItemsList').innerHTML = savedItems;
      if (savedTotal) document.getElementById('checkoutTotal').textContent = savedTotal;

      // ആദ്യ തവണ ലോഡ് ചെയ്യുമ്പോൾ തന്നെ ലിങ്ക് ഉണ്ടാക്കുന്നു
      generateOrderLink();

      document.getElementById('realWhatsAppBtn').addEventListener('click', () => {
        localStorage.clear(); // കാർട്ട് ക്ലീൻ ചെയ്യുന്നു
      });
    });
  </script>
</body>
</html>
