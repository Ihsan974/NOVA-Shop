<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .checkout-wrapper {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            gap: 20px;
        }
        .container-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex: 1;
        }
        .summary-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 320px;
        }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .total-section {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin: 20px 0;
            font-size: 16px;
        }
        .confirm-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            cursor: pointer;
            transition: background 0.2s;
        }
        .confirm-btn:hover { background-color: #333; }
    </style>
</head>
<body>

<!-- ഒഫീഷ്യൽ ലിങ്ക് ഫോമിൽ തന്നെ നേരിട്ട് നൽകിയിരിക്കുന്നു, ഇത് ബ്രൗസർ ഒട്ടും ബ്ലോക്ക് ചെയ്യില്ല -->
<form id="whatsappOrderForm" action="https://whatsapp.com" method="get" target="_blank">
    
    <!-- നിങ്ങളുടെ വാട്സാപ്പ് നമ്പർ -->
    <input type="hidden" name="phone" value="918921033257">
    
    <!-- വാട്സാപ്പിലേക്ക് പോകുന്ന മെസ്സേജ് ഈ ഇൻപുട്ടിൽ തനിയെ ജനറേറ്റ് ചെയ്യപ്പെടും -->
    <input type="hidden" name="text" id="whatsappTextMessage">

    <div class="checkout-wrapper">
        <!-- ഇടത് വശം: കസ്റ്റമർ വിവരങ്ങൾ -->
        <div class="container-box">
            <h2>Shipping Details</h2>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="custName" placeholder="Enter full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="custEmail" placeholder="Enter email address" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="custPhone" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <input type="text" id="custAddress" placeholder="Enter delivery address" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="custCity" placeholder="City" required>
                </div>
                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" id="custPincode" placeholder="0000" required>
                </div>
            </div>
        </div>

        <!-- വലത് വശം: ഓർഡർ വിവരങ്ങൾ -->
        <div class="summary-box">
            <h2>Order Summary</h2>
            
            <div class="total-section">
                <span>Total Amount</span>
                <span id="checkoutTotal">₹0</span>
            </div>

            <!-- കൺഫേം ബട്ടൺ -->
            <button type="submit" class="confirm-btn">Confirm Order</button>
        </div>
    </div>
</form>

<script>
// പേജ് ലോഡ് ചെയ്യുമ്പോൾ തുക കാണിക്കാൻ
document.addEventListener('DOMContentLoaded', () => {
  const savedTotal = localStorage.getItem('cartTotalAmount');
  if (savedTotal && document.getElementById('checkoutTotal')) {
    document.getElementById('checkoutTotal').textContent = savedTotal;
  }
});

// ബട്ടൺ ക്ലിക്ക് ചെയ്യുമ്പോൾ സന്ദേശം നിർമ്മിച്ച് ഫോം സബ്മിറ്റ് ചെയ്യും
document.getElementById('whatsappOrderForm').addEventListener('submit', function(e) {
    // ഫോമിൽ നിന്നും കസ്റ്റമർ വിവരങ്ങൾ എടുക്കുന്നു
    const name = document.getElementById('custName').value;
    const email = document.getElementById('custEmail').value;
    const phone = document.getElementById('custPhone').value;
    const address = document.getElementById('custAddress').value;
    const city = document.getElementById('custCity').value;
    const pincode = document.getElementById('custPincode').value;
    const totalAmount = document.getElementById('checkoutTotal').textContent;

    // വാട്സാപ്പിൽ കാണിക്കേണ്ട സന്ദേശത്തിന്റെ ഘടന (Format)
    const message = `📦 NEW ORDER RECEIVED!\n\n👤 Name: ${name}\n📧 Email: ${email}\n📞 Phone: ${phone}\n🏠 Address: ${address}, ${city} - ${pincode}\n\n💰 Total Amount: ${totalAmount}\n\nPlease confirm my order. Thank you!`;

    // രഹസ്യ ഇൻപുട്ടിലേക്ക് മെസ്സേജ് സെറ്റ് ചെയ്യുന്നു
    document.getElementById('whatsappTextMessage').value = message;
    
    // ഇനി ഫോം അതിന്റെ ഒഫീഷ്യൽ വഴിക്ക് വാട്സാപ്പിലേക്ക് പൊയ്ക്കോളും (ബ്ലോക്കിംഗ് പ്രശ്നം ഉണ്ടാകില്ല)
});
</script>

</body>
</html>
