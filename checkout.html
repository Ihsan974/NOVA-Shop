<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .checkout-wrapper {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            gap: 20px;
        }
        .container-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex: 1;
        }
        .summary-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 320px;
        }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .total-section {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin: 20px 0;
            font-size: 16px;
        }
        .confirm-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            cursor: pointer;
            transition: background 0.2s;
        }
        .confirm-btn:hover { background-color: #333; }
    </style>
</head>
<body>

<!-- ✅ ജാവാസ്ക്രിപ്റ്റ് വഴി നിയന്ത്രിക്കുന്നതിനാൽ ഫോം ആക്ഷൻ ആവശ്യമില്ല -->
<form id="whatsappOrderForm">
    <div class="checkout-wrapper">
        <!-- ഇടത് വശം: കസ്റ്റമർ വിവരങ്ങൾ -->
        <div class="container-box">
            <h2>Shipping Details</h2>
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="custName" placeholder="Enter full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="custEmail" placeholder="Enter email address" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="custPhone" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <input type="text" id="custAddress" placeholder="Enter delivery address" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="custCity" placeholder="City" required>
                </div>
                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" id="custPincode" placeholder="0000" required>
                </div>
            </div>
        </div>

        <!-- വലത് വശം: ഓർഡർ വിവരങ്ങൾ -->
        <div class="summary-box">
            <h2>Order Summary</h2>
            
            <div class="total-section">
                <span>Total Amount</span>
                <span id="checkoutTotal">₹0</span>
            </div>

            <!-- കൺഫേം ബട്ടൺ -->
            <button type="submit" class="confirm-btn">Confirm Order</button>
        </div>
    </div>
</form>

<script>
// പേജ് ലോഡ് ചെയ്യുമ്പോൾ തുക കാണിക്കാൻ
document.addEventListener('DOMContentLoaded', () => {
  const savedTotal = localStorage.getItem('cartTotalAmount');
  if (savedTotal && document.getElementById('checkoutTotal')) {
    document.getElementById('checkoutTotal').textContent = savedTotal;
  }
});

// ഫോം സബ്മിറ്റ് ചെയ്യുമ്പോൾ വാട്സാപ്പിലേക്ക് വിവരങ്ങൾ അയക്കാൻ
document.getElementById('whatsappOrderForm').addEventListener('submit', function(e) {
    e.preventDefault(); // പേജ് റീഫ്രഷ് ആകുന്നത് തടയുന്നു

    // നിങ്ങളുടെ വാട്സാപ്പ് നമ്പർ (കൺട്രി കോഡ് സഹിതം)
    const myWhatsAppNumber = "918921033257"; 

    // ഫോമിൽ നിന്നും കസ്റ്റമർ വിവരങ്ങൾ എടുക്കുന്നു
    const name = document.getElementById('custName').value;
    const email = document.getElementById('custEmail').value;
    const phone = document.getElementById('custPhone').value;
    const address = document.getElementById('custAddress').value;
    const city = document.getElementById('custCity').value;
    const pincode = document.getElementById('custPincode').value;
    const totalAmount = document.getElementById('checkoutTotal').textContent;

    // വാട്സാപ്പിൽ കാണിക്കേണ്ട സന്ദേശത്തിന്റെ ഘടന (Format)
    const message = `📦 *NEW ORDER RECEIVED!*
Please check my shipping details below:

👤 *Name:* ${name}
📧 *Email:* ${email}
📞 *Phone:* ${phone}
🏠 *Address:* ${address}, ${city} - ${pincode}

💰 *Total Amount:* ${totalAmount}

Please confirm my order. Thank you!`;

    // ലിങ്ക് കൃത്യമായി എൻകോഡ് ചെയ്യുന്നു (നിങ്ങൾക്ക് ആവശ്യമുള്ള api.whatsapp.com ലിങ്ക്)
    const whatsappUrl = `https://whatsapp.com{myWhatsAppNumber}&text=${encodeURIComponent(message)}`;

    // പുതിയ ടാബിലോ വിൻഡോയിലോ വാട്സാപ്പ് ഓപ്പൺ ചെയ്യുന്നു (ഇത് ബ്രൗസർ ബ്ലോക്ക് ചെയ്യില്ല)
    window.open(whatsappUrl, '_blank');
});
</script>

</body>
</html>
