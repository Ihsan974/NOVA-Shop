<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .checkout-wrapper {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            gap: 20px;
        }
        .container-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex: 1;
        }
        .summary-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 320px;
        }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .total-section {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin: 20px 0;
            font-size: 16px;
        }
        /* കൺഫേം ഓർഡർ ബട്ടൺ സ്റ്റൈൽ */
        .confirm-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            cursor: pointer;
            transition: background 0.2s;
        }
        .confirm-btn:hover { background-color: #333; }
    </style>
</head>
<body>

<!-- ✅ ജാവാസ്ക്രിപ്റ്റ് ഇല്ലാതെ ബ്രൗസർ ബ്ലോക്ക് ചെയ്യാത്ത ഒഫീഷ്യൽ വാട്സാപ്പ് ഫോം ആക്ഷൻ -->
<form action="https://whatsapp.com" method="get" target="_blank">
    
    <!-- നിങ്ങളുടെ വാട്സാപ്പ് നമ്പറും ഡിഫോൾട്ട് മെസ്സേജും ഇതിലൂടെ വാട്സാപ്പിലേക്ക് പോകും -->
    <input type="hidden" name="phone" value="918921033257">
    <input type="hidden" name="text" value="📦 NEW ORDER RECEIVED! Please check my shipping details.">

    <div class="checkout-wrapper">
        <!-- ഇടത് വശം: കസ്റ്റമർ വിവരങ്ങൾ -->
        <div class="container-box">
            <h2>Shipping Details</h2>
            
            <div class="form-group">
                <label>Full Name</label>
                <!-- കസ്റ്റമർ ടൈപ്പ് ചെയ്യുന്ന വിവരങ്ങൾ ലിങ്കിൽ വരാൻ name ഫീൽഡുകൾ ഉപയോഗിക്കുന്നു -->
                <input type="text" name="name" placeholder="Enter full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter email address" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone_number" placeholder="Enter phone number" required>
                </div>
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <input type="text" name="address" placeholder="Enter delivery address" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" name="city" placeholder="City" required>
                </div>
                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" name="pincode" placeholder="0000" required>
                </div>
            </div>
        </div>

        <!-- വലത് വശം: ഓർഡർ വിവരങ്ങൾ -->
        <div class="summary-box">
            <h2>Order Summary</h2>
            
            <div id="checkoutItemsList"></div>
            
            <div class="total-section">
                <span>Total Amount</span>
                <span id="checkoutTotal">₹0</span>
            </div>

            <!-- ✅ സാധാരണ സബ്മിറ്റ് ബട്ടൺ (ഇത് ക്ലിക്ക് ചെയ്യുമ്പോൾ നേരിട്ട് വാട്സാപ്പ് വെബ്ബിലേക്ക് പൊയ്ക്കോളും) -->
            <button type="submit" class="confirm-btn">Confirm Order</button>
        </div>
    </div>
</form>

<script>
// പേജ് ലോഡ് ചെയ്യുമ്പോൾ ലോക്കൽ സ്റ്റോറേജിലുള്ള തുക മാത്രം കാണിക്കാൻ ഈ ചെറിയ സ്ക്രിപ്റ്റ് ഉപയോഗിക്കാം
document.addEventListener('DOMContentLoaded', () => {
  const savedItems = localStorage.getItem('cartItemsHTML');
  const savedTotal = localStorage.getItem('cartTotalAmount');

  if (savedItems && document.getElementById('checkoutItemsList')) {
    document.getElementById('checkoutItemsList').innerHTML = savedItems;
  }
  if (savedTotal && document.getElementById('checkoutTotal')) {
    document.getElementById('checkoutTotal').textContent = savedTotal;
  }
});
</script>

</body>
</html>
