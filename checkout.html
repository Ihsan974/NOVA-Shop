<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | NOVA</title>
  <style>
    body {
      background-color: #f8f9fa;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .checkout-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 40px;
    }
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; margin: 20px auto; }
    }
    .checkout-section {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #444;
    }
    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .order-summary-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      height: fit-content;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 18px;
      font-weight: 600;
    }
    .btn-submit-order {
      width: 100%;
      background: #111111;
      color: #ffffff;
      padding: 15px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 25px;
    }
    .btn-submit-order:hover {
      background: #333333;
    }
  </style>
</head>
<body>

  <div id="mainCheckoutContent" class="checkout-container">
    <div class="checkout-section">
      <h2>Shipping Details</h2>
      <form id="checkoutForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="John Doe" value="test" required>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="john@example.com" value="ihsansanu974@gmail.com" required>
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="9876543210" value="8921033257" required>
          </div>
        </div>

        <div class="form-group">
          <label>Delivery Address</label>
          <input type="text" id="address" placeholder="House Name, Street Address" value="test" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" placeholder="Kochi" value="test" required>
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <input type="text" id="pincode" placeholder="682001" value="0000" required>
          </div>
        </div>
      </form>
    </div>

    <div class="order-summary-box">
      <h2>Order Summary</h2>
      <div id="checkoutItemsList">
        <!-- കാർട്ടിലെ വിവരങ്ങൾ ഇവിടെ വരും -->
      </div>
      
      <div class="summary-total">
        <span>Total Amount</span>
        <span id="checkoutTotal">₹0</span>
      </div>

      <button type="submit" form="checkoutForm" class="btn-submit-order">Confirm Order</button>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const savedItems = localStorage.getItem('cartItemsHTML');
    const savedTotal = localStorage.getItem('cartTotalAmount') || "₹0";

    if (savedItems) document.getElementById('checkoutItemsList').innerHTML = savedItems;
    if (savedTotal) document.getElementById('checkoutTotal').textContent = savedTotal;

    const form = document.getElementById('checkoutForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault(); 

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const city = document.getElementById('city').value;
        const pincode = document.getElementById('pincode').value;

        let msgText = "📦 NEW ORDER RECEIVED!\n\n";
        msgText += "👤 Customer Details:\n";
        msgText += "• Name: " + name + "\n";
        msgText += "• Phone: " + phone + "\n\n";
        msgText += "📍 Shipping Address:\n";
        msgText += "• Address: " + address + "\n";
        msgText += "• City: " + city + " - " + pincode + "\n\n";
        msgText += "💰 Total Amount: " + savedTotal + "\n\n";
        msgText += "Thank you for shopping with NOVA!";

        // ⚠️ കമ്പ്യൂട്ടറിലും ഫോണിലും ഒരു തടസ്സവുമില്ലാതെ ലിങ്ക് വർക്ക് ചെയ്യാൻ https://whatsapp.com ഫോർമാറ്റ് നൽകി
        const whatsappURL = "https://whatsapp.com?phone=918921033257&text=" + encodeURIComponent(msgText);
        
        localStorage.clear(); 

        // യഥാർത്ഥ പരിഹാരം: ഇവിടെ target="_self" എന്ന് മാറ്റി നൽകിയിട്ടുണ്ട്. ഇത് ബ്രൗസർ ഒട്ടും ബ്ലോക്ക് ചെയ്യില്ല.
        document.body.innerHTML = `
          <div style="max-width: 550px; margin: 80px auto; padding: 40px 30px; background: #ffffff; text-align: center; border-radius: 12px; box-shadow: 0 4px 25px rgba(0,0,0,0.08); font-family: -apple-system, sans-serif; box-sizing: border-box;">
            <div style="font-size: 50px; color: #25D366; margin-bottom: 20px;">🎉</div>
            <h2 style="font-size: 24px; margin-bottom: 10px; color: #111111;">Order Details Saved!</h2>
            <p style="color: #666666; font-size: 14px; margin-bottom: 20px; line-height: 1.5;">Please copy the order text below and send it to our official WhatsApp number: <strong>+91 89210 33257</strong></p>
            
            <textarea readonly style="width: 100%; height: 160px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-family: monospace; font-size: 13px; background: #fafafa; resize: none; box-sizing: border-box; margin-bottom: 20px;">${msgText}</textarea>
            
            <a href="${whatsappURL}" target="_self" style="display: block; background: #25D366; color: #ffffff; padding: 15px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 16px; margin-bottom: 15px;">
              🚀 Open WhatsApp & Send Order
            </a>
            <a href="index.html" style="display: inline-block; color: #111111; text-decoration: underline; font-size: 14px;">Back to Home</a>
          </div>
        `;
      });
    }
  });
</script>

</body>
</html>
