<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | NOVA</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f8f9fa;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .checkout-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 40px;
    }
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; margin: 20px auto; }
    }
    .checkout-section {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #444;
    }
    input[type="text"], input[type="email"], input[type="tel"], select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border 0.2s;
    }
    input:focus, select:focus {
      border-color: #111111;
      outline: none;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .order-summary-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      height: fit-content;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-size: 15px;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 18px;
      font-weight: 600;
    }
    .btn-place-order {
      width: 100%;
      background: #111111;
      color: #ffffff;
      padding: 15px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 25px;
      transition: background 0.2s;
    }
    .btn-place-order:hover {
      background: #333333;
    }
    .payment-options label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid #eee;
      border-radius: 6px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .payment-options input:checked + span {
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="checkout-container">
    <!-- ഇടത് വശം: ഷിപ്പിംഗ് ഫോം -->
    <div class="checkout-section">
      <h2>Shipping Details</h2>
      <form id="checkoutForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="John Doe">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required placeholder="9876543210">
          </div>
        </div>

        <div class="form-group">
          <label for="address">Delivery Address</label>
          <input type="text" id="address" required placeholder="House Name, Street Address">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" required placeholder="Kochi">
          </div>
          <div class="form-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" required placeholder="682001">
          </div>
        </div>

        <h2 style="margin-top: 40px;">Payment Method</h2>
        <div class="payment-options">
          <label>
            <input type="radio" name="payment" value="COD" checked>
            <span>Cash on Delivery (COD)</span>
          </label>
          <label>
            <input type="radio" name="payment" value="UPI">
            <span>UPI / Cards (Pay Online)</span>
          </label>
        </div>
      </form>
    </div>

    <!-- വലത് വശം: ഓർഡർ വിവരങ്ങൾ -->
    <div class="order-summary-box">
      <h2>Order Summary</h2>
      <div id="checkoutItemsList">
        <!-- കാർട്ടിലെ സാധനങ്ങൾ ഇവിടെ ജാവാസ്ക്രിപ്റ്റ് വഴി വരും -->
        <p style="color: #666; font-size: 14px;">Reviewing your items...</p>
      </div>
      
      <div class="summary-total">
        <span>Total Amount</span>
        <span id="checkoutTotal">₹0</span>
      </div>

      <button type="submit" form="checkoutForm" class="btn-place-order">Confirm Order</button>
    </div>
  </div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. കാർട്ട് വിവരങ്ങൾ ഇവിടെ കാണിക്കുന്നു
    const savedItems = localStorage.getItem('cartItemsHTML');
    const savedTotal = localStorage.getItem('cartTotalAmount');

    const itemsContainer = document.getElementById('checkoutItemsList');
    const totalContainer = document.getElementById('checkoutTotal');

    if (savedItems && itemsContainer) {
      itemsContainer.innerHTML = savedItems;
    }
    if (savedTotal && totalContainer) {
      totalContainer.textContent = savedTotal;
    }

    // 2. ഫോം സബ്മിറ്റ് ചെയ്യുമ്പോൾ ബ്രൗസറിന് ഒരു ബ്ലോക്കും ചെയ്യാൻ പറ്റാത്ത സുരക്ഷിതമായ വഴി
    const form = document.getElementById('checkoutForm');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault(); // ഡിഫോൾട്ട് റീഫ്രഷിംഗ് തടയുന്നു

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const city = document.getElementById('city').value;
        const pincode = document.getElementById('pincode').value;
        const payment = document.querySelector('input[name="payment"]:checked').value;
        
        const myWhatsAppNumber = "918921033257"; 

        let msgText = "NEW ORDER RECEIVED!\n\n";
        msgText += "Customer Details:\n";
        msgText += "Name: " + name + "\n";
        msgText += "Phone: " + phone + "\n\n";
        
        msgText += "Shipping Address:\n";
        msgText += "Address: " + address + "\n";
        msgText += "City: " + city + " - " + pincode + "\n\n";
        
        msgText += "Payment Method: " + payment + "\n";
        msgText += "Total Amount: " + (savedTotal || "₹0") + "\n\n";
        msgText += "Thank you for shopping with NOVA!";

        const whatsappURL = "https://whatsapp.com" + myWhatsAppNumber + "&text=" + encodeURIComponent(msgText);
        
        localStorage.clear(); // കാർട്ട് ക്ലീൻ ചെയ്യുന്നു
        
        // ബ്രൗസറിന്റെ എല്ലാ ബ്ലോക്കുകളും തകർക്കാൻ വിൻഡോ ഒബ്ജക്റ്റ് മാറ്റുന്നു
        window.location.assign(whatsappURL);
      });
    }
  });
</script>






</body>
</html>
