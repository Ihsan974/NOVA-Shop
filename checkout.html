<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #1c1c1c;
        }

        .checkout-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .container-box,
        .summary-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
        }

        .container-box {
            flex: 1;
        }

        .summary-box {
            width: 320px;
        }

        h2 {
            margin: 0 0 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eeeeee;
            font-size: 21px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d5d5;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #1c1c1c;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .total-section span {
            font-size: 16px;
            font-weight: 600;
        }

        .total-amount {
            font-size: 22px;
            font-weight: bold;
        }

        /* വാട്സ്ആപ്പ് ബട്ടൺ സ്റ്റൈൽ */
        .confirm-btn {
            display: block;
            width: 100%;
            background: #1c1c1c;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            border-radius: 7px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .confirm-btn:hover {
            background: #333333;
        }
    </style>
</head>
<body>

    <div class="checkout-wrapper">
        <!-- Shipping Details Form -->
        <div class="container-box">
            <h2>Shipping Details</h2>
            <form id="checkoutForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Your Name" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="name@email.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Phone Number" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <input type="text" id="address" placeholder="Address" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" placeholder="City" required>
                    </div>
                    <div class="form-group">
                        <label for="pincode">Pincode</label>
                        <input type="text" id="pincode" placeholder="Pincode" required>
                    </div>
                </div>
            </form>
        </div>

        <!-- Order Summary Box -->
        <div class="summary-box">
            <h2>Order Summary</h2>
            <div class="total-section">
                <span>Total Amount</span>
                <span class="total-amount">₹8,999</span>
            </div>
            <!-- വാട്സ്ആപ്പ് ട്രിഗർ ചെയ്യുന്ന ബട്ടൺ -->
            <button type="button" class="confirm-btn" onclick="sendToWhatsApp()">Confirm Order</button>
        </div>
    </div>

    <script>
        function sendToWhatsApp() {
            // ഫോമിലെ വിവരങ്ങൾ എടുക്കുന്നു
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const city = document.getElementById('city').value.trim();
            const pincode = document.getElementById('pincode').value.trim();

            // എല്ലാ ഫീൽഡുകളും പൂരിപ്പിച്ചിട്ടുണ്ടെന്ന് ഉറപ്പാക്കുന്നു
            if (!name || !email || !phone || !address || !city || !pincode) {
                alert('ദയവായി എല്ലാ വിവരങ്ങളും കൃത്യമായി പൂരിപ്പിക്കുക.');
                return;
            }

            // നിങ്ങളുടെ ബിസിനസ്സ് വാട്സ്ആപ്പ് നമ്പർ ഇവിടെ നൽകുക (കൺട്രി കോഡ് സഹിതം, സ്പേസ് പാടില്ല)
            const whatsappNumber = "918921033257"; 

            // ഓർഡർ വിവരങ്ങൾ മെസ്സേജ് രൂപത്തിലാക്കുന്നു
            const message = `Hello Nova, I would like to place an order!\n\n` +
                            `🛍️ *Order Details:*\n` +
                            `• Total Amount: ₹8,999\n\n` +
                            `📍 *Shipping Details:*\n` +
                            `• Name: ${name}\n` +
                            `• Phone: ${phone}\n` +
                            `• Email: ${email}\n` +
                            `• Address: ${address}, ${city} - ${pincode}`;

            // മെസ്സേജ് URL-ലേക്ക് മാറ്റുന്നു (URL Encoding)
            const encodedMessage = encodeURIComponent(message);

            // വാട്സ്ആപ്പ് വിൻഡോ പുതിയ ടാബിൽ തുറക്കുന്നു
            const whatsappURL = `https://whatsapp.com{whatsappNumber}&text=${encodedMessage}`;
            window.open(whatsappURL, '_blank');
        }
    </script>

</body>
</html>
