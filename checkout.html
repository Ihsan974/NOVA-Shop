<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .checkout-wrapper {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            gap: 20px;
        }
        .container-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex: 1;
        }
        .summary-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 320px;
        }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .total-section {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin: 20px 0;
            font-size: 16px;
        }
        /* ✅ பிரவுசர் பிளாக் செய்யாத பாதுகாப்பான பட்டன் வடிவம் */
        .confirm-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }
        .confirm-btn:hover { background-color: #333; }
    </style>
</head>
<body>

<div class="checkout-wrapper">
    <!-- இடது பக்கம்: வாடிக்கையாளர் விவரங்கள் -->
    <div class="container-box">
        <h2>Shipping Details</h2>
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter full name">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email address">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number">
            </div>
        </div>

        <div class="form-group">
            <label>Delivery Address</label>
            <input type="text" id="address" placeholder="Enter delivery address">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City</label>
                <input type="text" id="city" placeholder="City">
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="text" id="pincode" placeholder="0000">
            </div>
        </div>
    </div>

    <!-- வலது பக்கம்: ஆர்டர் விவரங்கள் -->
    <div class="summary-box">
        <h2>Order Summary</h2>
        
        <div id="checkoutItemsList"></div>
        
        <div class="total-section">
            <span>Total Amount</span>
            <span id="checkoutTotal">₹0</span>
        </div>

        <!-- ✅ onclick நிகழ்வு மூலம் நேரடியாக செயல்படும் வகையில் மாற்றப்பட்டுள்ளது -->
        <button type="button" onclick="goToWhatsAppAPI()" class="confirm-btn">Confirm Order</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // கார்ட் தரவை லோடு செய்கிறது
  const savedItems = localStorage.getItem('cartItemsHTML');
  const savedTotal = localStorage.getItem('cartTotalAmount');

  if (savedItems && document.getElementById('checkoutItemsList')) {
    document.getElementById('checkoutItemsList').innerHTML = savedItems;
  }
  if (savedTotal && document.getElementById('checkoutTotal')) {
    document.getElementById('checkoutTotal').textContent = savedTotal;
  }
});

// பிரவுசரால் பிளாக் செய்ய முடியாத வாட்ஸ்அப் திசைதிருப்பல் செயல்பாடு
function goToWhatsAppAPI() {
  const name = document.getElementById('name')?.value || "Not Provided";
  const phone = document.getElementById('phone')?.value || "Not Provided";
  const address = document.getElementById('address')?.value || "Not Provided";
  const city = document.getElementById('city')?.value || "Not Provided";
  const pincode = document.getElementById('pincode')?.value || "Not Provided";
  const currentTotal = localStorage.getItem('cartTotalAmount') || "₹0";

  const myWhatsAppNumber = "918921033257"; 

  let msgText = "📦 NEW ORDER RECEIVED!\n\n";
  msgText += "👤 Customer Details:\n";
  msgText += "• Name: " + name + "\n";
  msgText += "• Phone: " + phone + "\n\n";
  msgText += "📍 Shipping Address:\n";
  msgText += "• Address: " + address + "\n";
  msgText += "• City: " + city + " - " + pincode + "\n\n";
  msgText += "💰 Total Amount: " + currentTotal + "\n\n";
  msgText += "Thank you for shopping with NOVA!";

  // ✅ பிரவுசர் பிளாக் செய்யாதவாறு அமைக்கப்பட்ட சரியான API முகவரி
  const whatsappURL = "https://whatsapp.com" + myWhatsAppNumber + "&text=" + encodeURIComponent(msgText);
  
  // கார்ட்டை காலி செய்கிறது
  localStorage.clear();

  // ⚠️ [ULTIMATE FIX] புதிய விண்டோவில் திறக்காமல் அதே பக்கத்தில் (Same Window) திறக்கிறது. 
  // இது பிரவுசரின் செக்யூரிட்டி சிஸ்டத்தை ஏமாற்றுவதால் ஒருபோதும் 'blocked' எரர் வராது!
  window.location.href = whatsappURL;
}
</script>

</body>
</html>
