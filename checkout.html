<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .checkout-wrapper {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            gap: 20px;
        }
        .container-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex: 1;
        }
        .summary-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 320px;
        }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .total-section {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin: 20px 0;
            font-size: 16px;
        }
        /* കൺഫേം ഓർഡർ ബട്ടൺ സ്റ്റൈൽ */
        .confirm-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .confirm-btn:hover { background-color: #333; }
    </style>
</head>
<body>

<div class="checkout-wrapper">
    <!-- ഇടത് വശം: കസ്റ്റമർ വിവരങ്ങൾ (ഇതിൽ എന്തും ടൈപ്പ് ചെയ്യാം) -->
    <div class="container-box">
        <h2>Shipping Details</h2>
        <div class="form-group"><label>Full Name</label><input type="text" placeholder="Enter full name"></div>
        <div class="form-row">
            <div class="form-group"><label>Email Address</label><input type="email" placeholder="Enter email address"></div>
            <div class="form-group"><label>Phone Number</label><input type="tel" placeholder="Enter phone number"></div>
        </div>
        <div class="form-group"><label>Delivery Address</label><input type="text" placeholder="Enter delivery address"></div>
        <div class="form-row">
            <div class="form-group"><label>City</label><input type="text" placeholder="City"></div>
            <div class="form-group"><label>Pincode</label><input type="text" placeholder="0000"></div>
        </div>
    </div>

    <!-- വലത് വശം: ഓർഡർ Summary -->
    <div class="summary-box">
        <h2>Order Summary</h2>
        <div id="checkoutItemsList"></div>
        <div class="total-section">
            <span>Total Amount</span>
            <span id="checkoutTotal">₹8,999</span>
        </div>

        <!-- ✅ ജാവാസ്ക്രിപ്റ്റും ഫോമും പൂർണ്ണമായി ഒഴിവാക്കിയുള്ള നേരിട്ടുള്ള ഒഫീഷ്യൽ ലിങ്ക്. 
             ഇത് അതേ ടാബിൽ തന്നെ തുറക്കുന്നതിനാൽ ബ്രൗസറിന് ഒരു കാരണവശാലും ബ്ലോക്ക് ചെയ്യാൻ കഴിയില്ല! -->
        <a href="https://whatsapp.com." 
           class="confirm-btn">
           Confirm Order
        </a>
    </div>
</div>

<script>
// ലോക്കൽ സ്റ്റോറേജിലുള്ള സാധനങ്ങൾ മാത്രം കാണിക്കാൻ ഈ ചെറിയ സ്ക്രിപ്റ്റ് (ഇതിൽ എറർ വരില്ല)
document.addEventListener('DOMContentLoaded', () => {
  const savedItems = localStorage.getItem('cartItemsHTML');
  const savedTotal = localStorage.getItem('cartTotalAmount');

  if (savedItems && document.getElementById('checkoutItemsList')) {
    document.getElementById('checkoutItemsList').innerHTML = savedItems;
  }
  if (savedTotal && document.getElementById('checkoutTotal')) {
    document.getElementById('checkoutTotal').textContent = savedTotal;
  }
});
</script>

</body>
</html>
