<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | NOVA</title>
  <style>
    body {
      background-color: #f8f9fa;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .checkout-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 40px;
    }
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; margin: 20px auto; }
    }
    .checkout-section {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #444;
    }
    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .order-summary-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      height: fit-content;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 18px;
      font-weight: 600;
    }
    /* കറുത്ത ബട്ടൺ ക്രോം ബ്രൗസർ ഒട്ടും ബ്ലോക്ക് ചെയ്യാത്ത രീതിയിലുള്ള സ്റ്റൈൽ */
    .btn-checkout-link {
      display: block;
      width: 100%;
      background: #111111;
      color: #ffffff;
      padding: 15px;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      margin-top: 25px;
      box-sizing: border-box;
      cursor: pointer;
    }
    .btn-checkout-link:hover {
      background: #333333;
    }
  </style>
</head>
<body>

  <div class="checkout-container">
    <div class="checkout-section">
      <h2>Shipping Details</h2>
      <!-- ഫോമിൽ ടൈപ്പ് ചെയ്യുമ്പോൾ തന്നെ ബാക്ക്ഗ്രൗണ്ടിൽ ലിങ്ക് റെഡിയാകാൻ oninput നൽകി -->
      <form id="checkoutForm" oninput="generateWhatsAppApiLink()">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="John Doe" value="test">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="john@example.com" value="ihsansanu974@gmail.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="9876543210" value="8921033257">
          </div>
        </div>

        <div class="form-group">
          <label>Delivery Address</label>
          <input type="text" id="address" placeholder="House Name, Street Address" value="test">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" placeholder="Kochi" value="test">
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <input type="text" id="pincode" placeholder="682001" value="0000">
          </div>
        </div>
      </form>
    </div>

    <div class="order-summary-box">
      <h2>Order Summary</h2>
      <div id="checkoutItemsList">
        <!-- കാർട്ടിലെ വിവരങ്ങൾ ഇവിടെ വരും -->
      </div>
      
      <div class="summary-total">
        <span>Total Amount</span>
        <span id="checkoutTotal">₹0</span>
      </div>

      <!-- യഥാർത്ഥ പരിഹാരം: ബ്രൗസറിന് ഒരു രീതിയിലും തടയാൻ കഴിയാത്ത നേരിട്ടുള്ള ലിങ്ക് ടാഗ് -->
      <a href="#" id="realConfirmBtn" target="_self" class="btn-checkout-link">Confirm Order</a>
    </div>
  </div>

  <script>
document.addEventListener('DOMContentLoaded', () => {
  // 1. പേജ് ലോഡ് ചെയ്യുമ്പോൾ കാർട്ട് വിവരങ്ങൾ ചെക്കൗട്ടിൽ കാണിക്കുന്നു
  const savedItems = localStorage.getItem('cartItemsHTML');
  const savedTotal = localStorage.getItem('cartTotalAmount');

  if (savedItems && document.getElementById('checkoutItemsList')) {
    document.getElementById('checkoutItemsList').innerHTML = savedItems;
  }
  if (savedTotal && document.getElementById('checkoutTotal')) {
    document.getElementById('checkoutTotal').textContent = savedTotal;
  }

  // 2. 'Confirm Order' ബട്ടൺ കണ്ടെത്തി അതിലേക്ക് ക്ലിക്ക് ഇവന്റ് നൽകുന്നു
  const confirmBtn = document.getElementById('realConfirmBtn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', (event) => {
      // ഫോം സബ്‌മിറ്റ് ആയി പേജ് ഓട്ടോമാറ്റിക് റീഫ്രഷ് ആകുന്നത് പൂർണ്ണമായി തടയുന്നു
      event.preventDefault();
      event.stopPropagation();

      // 3. കസ്റ്റമർ ഫോമിൽ ടൈപ്പ് ചെയ്ത വിവരങ്ങൾ തത്സമയം എടുക്കുന്നു
      const name = document.getElementById('name')?.value || "Not Provided";
      const phone = document.getElementById('phone')?.value || "Not Provided";
      const address = document.getElementById('address')?.value || "Not Provided";
      const city = document.getElementById('city')?.value || "Not Provided";
      const pincode = document.getElementById('pincode')?.value || "Not Provided";
      const currentTotal = localStorage.getItem('cartTotalAmount') || "₹0";

      const myWhatsAppNumber = "918921033257"; 

      // 4. വാട്സാപ്പിൽ കാണിക്കേണ്ട മെസ്സേജ് ഫോർമാറ്റ് ചെയ്യുന്നു
      let msgText = "📦 NEW ORDER RECEIVED!\n\n";
      msgText += "👤 Customer Details:\n";
      msgText += "• Name: " + name + "\n";
      msgText += "• Phone: " + phone + "\n\n";
      msgText += "📍 Shipping Address:\n";
      msgText += "• Address: " + address + "\n";
      msgText += "• City: " + city + " - " + pincode + "\n\n";
      msgText += "💰 Total Amount: " + currentTotal + "\n\n";
      msgText += "Thank you for shopping with NOVA!";

      // 5. ഒഫീഷ്യൽ വാട്സാപ്പ് വെബ് കണ്ടിന്യൂ ലിങ്ക് നൽകുന്നു
      const whatsappURL = "https://whatsapp.com" + myWhatsAppNumber + "&text=" + encodeURIComponent(msgText);
      
      // ⚠️ [BEST TRICK] ജാവാസ്ക്രിപ്റ്റ് വഴി താല്ക്കാലികമായി ഒരു ലിങ്ക് ഉണ്ടാക്കി ക്ലിക്ക് ചെയ്യിക്കുന്നു
      // ഇത് ബ്രൗസറിനെ പറ്റിക്കുകയും 'about:blank' വരുന്നത് പൂർണ്ണമായി ഒഴിവാക്കുകയും ചെയ്യും
      const tempLink = document.createElement('a');
      tempLink.href = whatsappURL;
      tempLink.target = '_blank';
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);

      // 6. ഓർഡർ കഴിഞ്ഞതുകൊണ്ട് 1 സെക്കൻഡിന് ശേഷം കാർട്ട് ക്ലിയർ ചെയ്യുന്നു
      setTimeout(() => {
        localStorage.clear();
      }, 1000);
    });
  }
});
</script>




</body>
</html>
