<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        /* ചെക്കൗട്ട് പേജിന്റെ ലളിതമായ സിഎസ്എസ് ഡിസൈൻ */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .checkout-wrapper {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            gap: 20px;
        }
        .container-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex: 1;
        }
        .summary-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 320px;
        }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .total-section {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin: 20px 0;
            font-size: 16px;
        }
        /* ✅ ബ്രൗസർ ഒട്ടും ബ്ലോക്ക് ചെയ്യാത്ത സുരക്ഷിതമായ ആങ്കർ ടാഗ് ബട്ടൺ സ്റ്റൈൽ */
        .confirm-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .confirm-btn:hover { background-color: #333; }
    </style>
</head>
<body>

<div class="checkout-wrapper">
    <!-- ഇടത് വശം: കസ്റ്റമർ ഷിപ്പിംഗ് വിവരങ്ങൾ -->
    <div class="container-box">
        <h2>Shipping Details</h2>
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter full name">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email address">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number">
            </div>
        </div>

        <div class="form-group">
            <label>Delivery Address</label>
            <input type="text" id="address" placeholder="Enter delivery address">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City</label>
                <input type="text" id="city" placeholder="City">
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="text" id="pincode" placeholder="0000">
            </div>
        </div>
    </div>

    <!-- വലത് വശം: ഓർഡർ വിവരങ്ങൾ -->
    <div class="summary-box">
        <h2>Order Summary</h2>
        
        <!-- കാർട്ടിലെ ഐറ്റംസ് ലിസ്റ്റ് കാണിക്കാൻ -->
        <div id="checkoutItemsList"></div>
        
        <div class="total-section">
            <span>Total Amount</span>
            <span id="checkoutTotal">₹0</span>
        </div>

        <!-- ✅ ജാവാസ്ക്രിപ്റ്റ് തകരാറിലായാലും അതേ പേജിൽ നേരിട്ട് ://whatsapp.com കൃത്യമായി തുറക്കുന്ന ബട്ടൺ ലിങ്ക് -->
        <a href="#" id="realConfirmBtn" class="confirm-btn">Confirm Order</a>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // 1. ലോക്കൽ സ്റ്റോറേജിലുള്ള സാധനങ്ങളും ടോട്ടൽ തുകയും പേജിൽ കാണിക്കുന്നു
  const savedItems = localStorage.getItem('cartItemsHTML');
  const savedTotal = localStorage.getItem('cartTotalAmount');

  if (savedItems && document.getElementById('checkoutItemsList')) {
    document.getElementById('checkoutItemsList').innerHTML = savedItems;
  }
  if (savedTotal && document.getElementById('checkoutTotal')) {
    document.getElementById('checkoutTotal').textContent = savedTotal;
  }

  // 2. കസ്റ്റമർ ടൈപ്പ് ചെയ്യുന്ന വിവരങ്ങൾ എടുത്ത് വാട്സാപ്പ് ലിങ്ക് മാറ്റുന്ന ഫങ്ക്ഷൻ
  function updateWhatsAppHref() {
    const name = document.getElementById('name')?.value || "Not Provided";
    const phone = document.getElementById('phone')?.value || "Not Provided";
    const address = document.getElementById('address')?.value || "Not Provided";
    const city = document.getElementById('city')?.value || "Not Provided";
    const pincode = document.getElementById('pincode')?.value || "Not Provided";
    const currentTotal = localStorage.getItem('cartTotalAmount') || "₹0";

    const myWhatsAppNumber = "918921033257"; 

    // വാട്സാപ്പിൽ കാണിക്കേണ്ട മെസ്സേജ് ഫോർമാറ്റ്
    let msgText = "📦 NEW ORDER RECEIVED!\n\n";
    msgText += "👤 Customer Details:\n";
    msgText += "• Name: " + name + "\n";
    msgText += "• Phone: " + phone + "\n\n";
    msgText += "📍 Shipping Address:\n";
    msgText += "• Address: " + address + "\n";
    msgText += "• City: " + city + " - " + pincode + "\n\n";
    msgText += "💰 Total Amount: " + currentTotal + "\n\n";
    msgText += "Thank you for shopping with NOVA!";

    // ✅ നിങ്ങൾ ആവശ്യപ്പെട്ട ഒഫീഷ്യൽ ://whatsapp.com ലിങ്ക് (അതേ ടാബിൽ തുറക്കാനുള്ള ഫോർമാറ്റ്)
    const whatsappURL = "https://://whatsapp.com/send?phone=" + myWhatsAppNumber + "&text=" + encodeURIComponent(msgText);
    
    // HTML ബട്ടണിലേക്ക് ഈ ലിങ്ക് നേരിട്ട് കയറ്റുന്നു
    const confirmLink = document.getElementById('realConfirmBtn');
    if (confirmLink) {
      confirmLink.href = whatsappURL;
    }
  }

  // കസ്റ്റമർ പേജ് തുറക്കുമ്പോൾ തന്നെ ആദ്യ ലിങ്ക് റെഡിയാക്കുന്നു
  updateWhatsAppHref();

  // 3. കസ്റ്റമർ ഓരോ ഇൻപുട്ടിലും ഓരോ അക്ഷരം ടൈപ്പ് ചെയ്യുമ്പോൾ ലിങ്ക് തത്സമയം അപ്ഡേറ്റ് ആകും
  const inputs = ['name', 'phone', 'address', 'city', 'pincode'];
  inputs.forEach(id => {
    document.getElementById(id)?.addEventListener('input', updateWhatsAppHref);
  });

  // 4. ബട്ടൺ ക്ലിക്ക് ചെയ്യുമ്പോൾ കാർട്ട് ക്ലിയർ ചെയ്യാൻ
  document.getElementById('realConfirmBtn')?.addEventListener('click', () => {
    setTimeout(() => {
      localStorage.clear(); 
    }, 1000);
  });
});
</script>

</body>
</html>
