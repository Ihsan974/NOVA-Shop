<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | NOVA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #1c1c1c;
        }

        .checkout-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;

            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .container-box,
        .summary-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.06);
        }

        .container-box {
            flex: 1;
        }

        .summary-box {
            width: 320px;
        }

        h2 {
            margin: 0 0 25px;
            padding-bottom: 15px;

            border-bottom: 1px solid #eeeeee;

            font-size: 21px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 600;

            color: #444444;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d5d5d5;
            border-radius: 7px;

            outline: none;

            font-size: 14px;

            transition: 0.2s ease;
        }

        input:focus {
            border-color: #1c1c1c;

            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .total-section {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin: 25px 0;
            padding: 18px 0;

            border-top: 1px solid #eeeeee;
            border-bottom: 1px solid #eeeeee;

            font-size: 16px;
            font-weight: bold;
        }

        #checkoutTotal {
            font-size: 21px;
        }

        .confirm-btn {
            width: 100%;

            padding: 15px;

            border: none;
            border-radius: 7px;

            background: #1c1c1c;
            color: #ffffff;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .confirm-btn:hover {
            background: #333333;
        }

        .confirm-btn:disabled {
            background: #888888;
            cursor: not-allowed;
        }

        #orderStatus {
            display: none;

            margin-top: 15px;

            text-align: center;

            font-size: 13px;
            line-height: 1.5;
        }

        #orderStatus.success {
            display: block;
            color: #16803c;
        }

        #orderStatus.error {
            display: block;
            color: #c62828;
        }

        .success-box {
            display: none;

            margin-top: 20px;
            padding: 18px;

            border-radius: 8px;

            background: #eefaf2;
            color: #16803c;

            text-align: center;

            font-size: 14px;
            line-height: 1.5;
        }

        .success-box.show {
            display: block;
        }

        .continue-btn {
            display: inline-block;

            margin-top: 12px;
            padding: 10px 18px;

            border-radius: 6px;

            background: #16803c;
            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        @media (max-width: 768px) {

            body {
                padding: 20px 15px;
            }

            .checkout-wrapper {
                flex-direction: column;
            }

            .container-box,
            .summary-box {
                width: 100%;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>

<body>

<form id="orderForm">

    <div class="checkout-wrapper">

        <!-- SHIPPING DETAILS -->

        <div class="container-box">

            <h2>
                Shipping Details
            </h2>


            <div class="form-group">

                <label for="custName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="custName"
                    placeholder="Enter full name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="custEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="custEmail"
                        placeholder="Enter email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="custPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="custPhone"
                        placeholder="Enter phone number"
                        autocomplete="tel"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="custAddress">
                    Delivery Address
                </label>

                <input
                    type="text"
                    id="custAddress"
                    placeholder="Enter delivery address"
                    autocomplete="street-address"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="custCity">
                        City
                    </label>

                    <input
                        type="text"
                        id="custCity"
                        placeholder="City"
                        autocomplete="address-level2"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="custPincode">
                        Pincode
                    </label>

                    <input
                        type="text"
                        id="custPincode"
                        placeholder="000000"
                        inputmode="numeric"
                        autocomplete="postal-code"
                        required
                    >

                </div>

            </div>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="summary-box">

            <h2>
                Order Summary
            </h2>


            <div class="total-section">

                <span>
                    Total Amount
                </span>

                <span id="checkoutTotal">
                    ₹0
                </span>

            </div>


            <button
                type="submit"
                id="confirmButton"
                class="confirm-btn"
            >
                Confirm Order
            </button>


            <p id="orderStatus"></p>


            <div
                id="successBox"
                class="success-box"
            >

                <strong>
                    Order submitted successfully!
                </strong>

                <br>

                Your order has been sent to our
                WhatsApp Business account.

                <br>

                <a
                    href="/"
                    class="continue-btn"
                >
                    Continue Shopping
                </a>

            </div>

        </div>

    </div>

</form>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        /*
        ==========================================
        LOAD CART TOTAL
        ==========================================
        */

        const savedTotal =
            localStorage.getItem(
                "cartTotalAmount"
            );

        const totalElement =
            document.getElementById(
                "checkoutTotal"
            );


        if (savedTotal) {

            totalElement.textContent =
                savedTotal;

        }

    }
);


/*
==========================================
ORDER FORM
==========================================
*/

document
    .getElementById("orderForm")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            /*
            ======================================
            ELEMENTS
            ======================================
            */

            const button =
                document.getElementById(
                    "confirmButton"
                );

            const status =
                document.getElementById(
                    "orderStatus"
                );

            const successBox =
                document.getElementById(
                    "successBox"
                );


            /*
            ======================================
            CUSTOMER DATA
            ======================================
            */

            const name =
                document
                    .getElementById("custName")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("custEmail")
                    .value
                    .trim();


            const phone =
                document
                    .getElementById("custPhone")
                    .value
                    .trim();


            const address =
                document
                    .getElementById("custAddress")
                    .value
                    .trim();


            const city =
                document
                    .getElementById("custCity")
                    .value
                    .trim();


            const pincode =
                document
                    .getElementById("custPincode")
                    .value
                    .trim();


            const totalAmount =
                document
                    .getElementById("checkoutTotal")
                    .textContent
                    .trim();


            /*
            ======================================
            BASIC VALIDATION
            ======================================
            */

            if (
                !name ||
                !email ||
                !phone ||
                !address ||
                !city ||
                !pincode
            ) {

                status.textContent =
                    "Please fill in all required fields.";

                status.className =
                    "error";

                return;

            }


            /*
            ======================================
            UI
            ======================================
            */

            button.disabled = true;

            button.textContent =
                "Sending Order...";


            status.textContent = "";

            status.className = "";

            successBox.classList.remove(
                "show"
            );


            /*
            ======================================
            ORDER OBJECT
            ======================================
            */

            const orderData = {

                name: name,

                email: email,

                phone: phone,

                address: address,

                city: city,

                pincode: pincode,

                totalAmount: totalAmount

            };


            /*
            ======================================
            SEND TO VERCEL API
            ======================================
            */

            try {

                const response =
                    await fetch(
                        "/api/send-order",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    orderData
                                )

                        }
                    );


                /*
                ==================================
                READ SERVER RESPONSE
                ==================================
                */

                let result;

                try {

                    result =
                        await response.json();

                } catch {

                    result = {};

                }


                /*
                ==================================
                SUCCESS
                ==================================
                */

                if (
                    response.ok &&
                    result.success === true
                ) {

                    status.textContent =
                        "Order sent successfully.";

                    status.className =
                        "success";


                    successBox.classList.add(
                        "show"
                    );


                    document
                        .getElementById(
                            "orderForm"
                        )
                        .reset();


                }

                /*
                ==================================
                ERROR
                ==================================
                */

                else {

                    status.textContent =
                        result.message ||
                        "Unable to send the order.";

                    status.className =
                        "error";

                }


            }

            catch (error) {

                console.error(
                    "Order Error:",
                    error
                );


                status.textContent =
                    "Unable to connect to the order server.";

                status.className =
                    "error";

            }


            /*
            ======================================
            RESTORE BUTTON
            ======================================
            */

            button.disabled = false;

            button.textContent =
                "Confirm Order";

        }
    );

</script>

</body>
</html>
