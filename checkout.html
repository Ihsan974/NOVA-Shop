<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #1c1c1c;
        }

        .checkout-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .container-box,
        .summary-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
        }

        .container-box {
            flex: 1;
        }

        .summary-box {
            width: 320px;
        }

        h2 {
            margin: 0 0 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eeeeee;
            font-size: 21px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d5d5;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #1c1c1c;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .total-label {
            font-size: 16px;
            font-weight: 600;
        }

        .total-price {
            font-size: 22px;
            font-weight: 700;
        }

        .btn-confirm {
            width: 100%;
            padding: 15px;
            background: #111111;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-confirm:hover {
            background: #2c2c2c;
        }

        .btn-confirm:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .error-message {
            margin-top: 15px;
            color: #d93838;
            font-size: 13px;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .checkout-wrapper {
                flex-direction: column;
            }
            .summary-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="checkout-wrapper">
    <!-- Shipping Details Form -->
    <div class="container-box">
        <h2>Shipping Details</h2>
        <form id="checkoutForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="John Doe">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required placeholder="9999999999">
                </div>
            </div>

            <div class="form-group">
                <label for="address">Delivery Address</label>
                <input type="text" id="address" required placeholder="Street, Apartment, Suite">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" required placeholder="Mumbai">
                </div>
                <div class="form-group">
                    <label for="pincode">Pincode</label>
                    <input type="text" id="pincode" required placeholder="400001">
                </div>
            </div>
        </form>
    </div>

    <!-- Order Summary Box -->
    <div class="summary-box">
        <h2>Order Summary</h2>
        <div class="total-section">
            <span class="total-label">Total Amount</span>
            <span class="total-price">₹8,999</span>
        </div>
        <button type="submit" form="checkoutForm" id="confirmBtn" class="btn-confirm">Confirm Order</button>
        <div id="errorMessage" class="error-message">Unable to connect to the order server. Please try again.</div>
    </div>
</div>

<script>
    document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const confirmBtn = document.getElementById('confirmBtn');
        const errorMessage = document.getElementById('errorMessage');
        
        // Change UI state to loading
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Processing...';
        errorMessage.style.display = 'none';

        // Gather Form Data
        const orderData = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            pincode: document.getElementById('pincode').value,
            amount: 8999
        };

        try {
            // REPLACE WITH YOUR ACTUAL BACKEND API URL
            const response = await fetch('https://your-backend-api.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(orderData)
            });

            if (response.ok) {
                const result = await response.json();
                alert('Order Placed Successfully!');
                // Redirect or clear cart here
                window.location.href = '/order-success.html'; 
            } else {
                throw new Error('Server responded with an error status');
            }

        } catch (error) {
            console.error('Checkout Error:', error);
            // Display the error message exactly like the design
            errorMessage.style.display = 'block';
        } finally {
            // Restore button state
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'Confirm Order';
        }
    });
</script>

</body>
</html>
