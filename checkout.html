<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | NOVA</title>
  <style>
    body {
      background-color: #f8f9fa;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .checkout-container {
      max-width: 1100px;
      margin: 60px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 40px;
    }
    @media (max-width: 768px) {
      .checkout-container { grid-template-columns: 1fr; margin: 20px auto; }
    }
    .checkout-section {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }
    h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #444;
    }
    input[type="text"], input[type="email"], input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .order-summary-box {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
      height: fit-content;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid #eee;
      font-size: 18px;
      font-weight: 600;
    }
    .btn-whatsapp-order {
      width: 100%;
      background: #25D366;
      color: #ffffff;
      padding: 15px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 25px;
    }
    .btn-whatsapp-order:hover {
      background: #20ba5a;
    }
  </style>
</head>
<body>

  <div class="checkout-container">
    <div class="checkout-section">
      <h2>Shipping Details</h2>
      <!-- முக்கிய மாற்றம்: ஃபார்ம் சப்மிட் ஆகும் போதே நேரடியாக wa.me லிங்கிற்குப் போகும் படி மாற்றப்பட்டது -->
      <form id="checkoutForm" action="https://wa.me" method="GET">
        <div class="form-group">
          <label>Full Name</label>
          <!-- மெசேஜ் ஃபார்மட்டில் வர ஏதுவாக name="text" பயன்படுத்தப்பட்டுள்ளது -->
          <input type="text" id="name" placeholder="John Doe" value="test">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="john@example.com" value="ihsansanu974@gmail.com">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="9876543210" value="8921033257">
          </div>
        </div>

        <div class="form-group">
          <label>Delivery Address</label>
          <input type="text" id="address" placeholder="House Name, Street Address" value="test">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>City</label>
            <input type="text" id="city" placeholder="Kochi" value="test">
          </div>
          <div class="form-group">
            <label>Pincode</label>
            <input type="text" id="pincode" placeholder="682001" value="0000">
          </div>
        </div>
        
        <!-- வாட்ஸ்அப் மெசேஜ் உரையைச் சேமிக்க ஒரு மறைமுக உள்ளீடு (Hidden Input) -->
        <input type="hidden" name="text" id="whatsappMessage">
      </form>
    </div>

    <div class="order-summary-box">
      <h2>Order Summary</h2>
      <div id="checkoutItemsList">
        <!-- கார்ட் விவரங்கள் இங்கே வரும் -->
      </div>
      
      <div class="summary-total">
        <span>Total Amount</span>
        <span id="checkoutTotal">₹0</span>
      </div>

      <button type="submit" form="checkoutForm" class="btn-whatsapp-order">Confirm & Send via WhatsApp</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedItems = localStorage.getItem('cartItemsHTML');
      const savedTotal = localStorage.getItem('cartTotalAmount') || "₹0";

      if (savedItems) document.getElementById('checkoutItemsList').innerHTML = savedItems;
      if (savedTotal) document.getElementById('checkoutTotal').textContent = savedTotal;

      const form = document.getElementById('checkoutForm');
      if (form) {
        form.addEventListener('submit', () => {
          const name = document.getElementById('name').value;
          const phone = document.getElementById('phone').value;
          const address = document.getElementById('address').value;
          const city = document.getElementById('city').value;
          const pincode = document.getElementById('pincode').value;

          let msgText = "NEW ORDER RECEIVED!\n\n";
          msgText += "Customer Details:\n";
          msgText += "Name: " + name + "\n";
          msgText += "Phone: " + phone + "\n\n";
          msgText += "Shipping Address:\n";
          msgText += "Address: " + address + "\n";
          msgText += "City: " + city + " - " + pincode + "\n\n";
          msgText += "Total Amount: " + savedTotal + "\n\n";
          msgText += "Thank you for shopping with NOVA!";

          // மறைமுக உள்ளீட்டில் (Hidden Input) வாட்ஸ்அப் மெசேஜை வைக்கிறோம்
          document.getElementById('whatsappMessage').value = msgText;
          
          localStorage.clear(); // கார்ட்டை காலி செய்கிறோம்
        });
      }
    });
  </script>
</body>
</html>
