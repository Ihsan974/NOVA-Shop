<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
        .checkout-wrapper {
            display: flex;
            max-width: 1000px;
            margin: 0 auto;
            gap: 20px;
        }
        .container-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex: 1;
        }
        .summary-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            width: 320px;
        }
        h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .total-section {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin: 20px 0;
            font-size: 16px;
        }
        /* കൺഫേം ഓർഡർ ബട്ടൺ സ്റ്റൈൽ */
        .confirm-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .confirm-btn:hover { background-color: #333; }
    </style>
</head>
<body>

<div class="checkout-wrapper">
    <!-- ഇടത് വശം: കസ്റ്റമർ ഷിപ്പിംഗ് വിവരങ്ങൾ -->
    <div class="container-box">
        <h2>Shipping Details</h2>
        
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter full name">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter email address">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number">
            </div>
        </div>

        <div class="form-group">
            <label>Delivery Address</label>
            <input type="text" id="address" placeholder="Enter delivery address">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>City</label>
                <input type="text" id="city" placeholder="City">
            </div>
            <div class="form-group">
                <label>Pincode</label>
                <input type="text" id="pincode" placeholder="0000">
            </div>
        </div>
    </div>

    <!-- വലത് വശം: ഓർഡർ വിവരങ്ങൾ -->
    <div class="summary-box">
        <h2>Order Summary</h2>
        
        <!-- കാർട്ടിലെ തകരാറിലായ എച്ച്.ടി.എം.എൽ ഒഴിവാക്കി വെറും വിവരങ്ങൾ മാത്രം കാണിക്കുന്നു -->
        <div id="checkoutItemsList" style="font-size: 14px; color: #666; margin-bottom: 15px;">Your items will be confirmed via WhatsApp</div>
        
        <div class="total-section">
            <span>Total Amount</span>
            <span id="checkoutTotal">₹0</span>
        </div>

        <!-- ✅ സുരക്ഷിതമായ ബട്ടൺ ആക്ഷൻ -->
        <button type="button" id="realConfirmBtn" class="confirm-btn">Confirm Order</button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // കാർട്ടിലെ ടോട്ടൽ തുക മാത്രം ലോഡ് ചെയ്ത് കാണിക്കുന്നു (തകരാറിലായ HTML നമ്മൾ പൂർണ്ണമായി ഒഴിവാക്കി)
  const savedTotal = localStorage.getItem('cartTotalAmount');
  if (savedTotal && document.getElementById('checkoutTotal')) {
    document.getElementById('checkoutTotal').textContent = savedTotal;
  }

  // ബട്ടൺ ക്ലിക്ക് ഇവന്റ്
  const confirmBtn = document.getElementById('realConfirmBtn');
  if (confirmBtn) {
    confirmBtn.addEventListener('click', () => {
      
      const name = document.getElementById('name')?.value || "Not Provided";
      const phone = document.getElementById('phone')?.value || "Not Provided";
      const address = document.getElementById('address')?.value || "Not Provided";
      const city = document.getElementById('city')?.value || "Not Provided";
      const pincode = document.getElementById('pincode')?.value || "Not Provided";
      const currentTotal = localStorage.getItem('cartTotalAmount') || "₹0";

      const myWhatsAppNumber = "918921033257"; 

      let msgText = "📦 NEW ORDER RECEIVED!\n\n";
      msgText += "👤 Customer Details:\n";
      msgText += "• Name: " + name + "\n";
      msgText += "• Phone: " + phone + "\n\n";
      msgText += "📍 Shipping Address:\n";
      msgText += "• Address: " + address + "\n";
      msgText += "• City: " + city + " - " + pincode + "\n\n";
      msgText += "💰 Total Amount: " + currentTotal + "\n\n";
      msgText += "Thank you for shopping with NOVA!";

      // ഒഫീഷ്യൽ വാട്സാപ്പ് വെബ് ലിങ്ക് ഫോർമാറ്റ്
      const whatsappURL = "https://whatsapp.com" + myWhatsAppNumber + "&text=" + encodeURIComponent(msgText);
      
      // ലോക്കൽ സ്റ്റോറേജ് ക്ലിയർ ചെയ്യുന്നു
      localStorage.clear();

      // അതേ വിൻഡോയിൽ തന്നെ വാട്സാപ്പ് വെബ്ബ് ലോഡ് ചെയ്യിക്കുന്നു
      window.location.href = whatsappURL;
    });
  }
});
</script>

</body>
</html>
