<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | NOVA</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: #f6f6f6;
            color: #1c1c1c;
        }

        .checkout-wrapper {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .container-box,
        .summary-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.06);
        }

        .container-box {
            flex: 1;
        }

        .summary-box {
            width: 320px;
        }

        h2 {
            margin: 0 0 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eeeeee;
            font-size: 21px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #444444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d5d5;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: #1c1c1c;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .total-label {
            font-size: 16px;
            font-weight: 600;
        }

        .total-price {
            font-size: 22px;
            font-weight: 700;
        }

        .btn-confirm {
            width: 100%;
            padding: 15px;
            background: #111111;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-confirm:hover {
            background: #2c2c2c;
        }

        @media (max-width: 768px) {
            .checkout-wrapper {
                flex-direction: column;
            }
            .summary-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<!-- 
  ഫോമിൽ നേരിട്ട് ://whatsapp.com ആക്ഷൻ നൽകിയിരിക്കുന്നു. 
  ⚠️ ദയവായി താഴെയുള്ള "919876543210" മാറ്റി നിങ്ങളുടെ ശരിക്കുള്ള വാട്സ്ആപ്പ് നമ്പർ നൽകുക.
-->
<form action="https://://whatsapp.com/send" method="GET" target="_blank">
    <!-- നിങ്ങളുടെ വാട്സ്ആപ്പ് നമ്പർ ഇവിടെയും കൃത്യമായി സെറ്റ് ചെയ്യുക -->
    <input type="hidden" name="phone" value="918921033257">

    <div class="checkout-wrapper">
        <!-- Shipping Details -->
        <div class="container-box">
            <h2>Shipping Details</h2>
            
            <div class="form-group">
                <label>Full Name</label>
                <!-- name="text" എന്ന് നൽകിയാൽ ഈ ഫീൽഡിലെ വിവരങ്ങൾ വാട്സ്ആപ്പിലേക്ക് പോകും -->
                <input type="text" name="text" placeholder="Your Name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@email.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Phone Number">
                </div>
            </div>

            <div class="form-group">
                <label>Delivery Address</label>
                <input type="text" placeholder="Address">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City</label>
                    <input type="text" placeholder="City">
                </div>
                <div class="form-group">
                    <label>Pincode</label>
                    <input type="text" placeholder="Pincode">
                </div>
            </div>
        </div>

        <!-- Order Summary Box -->
        <div class="summary-box">
            <h2>Order Summary</h2>
            <div class="total-section">
                <span class="total-label">Total Amount</span>
                <span class="total-price">₹8,999</span>
            </div>
            
            <!-- ഈ ബട്ടൺ ക്ലിക്ക് ചെയ്യുമ്പോൾ ഫോം ഓട്ടോമാറ്റിക് ആയി വാട്സ്ആപ്പിലേക്ക് പോകും -->
            <button type="submit" class="btn-confirm">Confirm Order</button>
        </div>
    </div>
</form>

</body>
</html>
